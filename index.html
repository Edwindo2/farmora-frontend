<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Farmora — Palm Oil from Nigeria, Delivered Anywhere</title>
    <meta name="description" content="Buy pure Nigerian palm oil online, with delivery across Nigeria and shipping worldwide." />
    <link rel="icon" type="image/png" href="/emblem.png" />
    <!-- installable as an app on phones ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#17451c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Farmora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&family=Poppins:wght@500;600;700;800&family=Lora:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
    <script>
      // apply the saved (or system) theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('farmora-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
